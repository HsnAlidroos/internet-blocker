name: blocker
description: "Block internet access for selected apps using GetX state management."
version: 1.0.0+5

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  #State management & Storage & Shimmer
  get: ^4.7.2
  get_storage: ^2.1.1
  get_shimmer: ^0.0.6

  #App info & Permissions
  installed_apps: ^1.6.0
  permission_handler: ^12.0.0+1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  #Use this if you want change app icon
  # flutter_launcher_icons: ^0.14.4
  
flutter:
  uses-material-design: true

  assets:
    - assets/logo.png